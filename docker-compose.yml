services:
  ollama:
    image: ollama/ollama:latest
    container_name: brasao-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # For NVIDIA GPU acceleration (requires nvidia-container-toolkit), use the
    # optional override file instead of editing this portable CPU-only default:
    #   make ollama-up-gpu
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama

volumes:
  ollama_data:
